name: CI — C# SDK

on:
  push:
    paths:
      - 'packages/sdk-csharp/**'
  pull_request:
    paths:
      - 'packages/sdk-csharp/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-csharp

    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore Theatrical.sln

      - name: Build
        run: dotnet build Theatrical.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Theatrical.sln --configuration Release --no-build --verbosity normal

  pack:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: packages/sdk-csharp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Theatrical.sln

      - name: Pack
        run: dotnet pack src/Theatrical.Sdk/Theatrical.Sdk.csproj --configuration Release --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: packages/sdk-csharp/artifacts/*.nupkg
